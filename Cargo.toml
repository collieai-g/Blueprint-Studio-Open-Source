[package]
name = "blueprint-backend"
version = "2.0.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Self-hosted company workspace with a Rust core"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
url = "2"
percent-encoding = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
minijinja = { version = "2", features = ["loader", "json", "fuel"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
quick-xml = "0.37"
yrs = { version = "0.24", features = ["sync"] }
cron = "0.15"
chrono-tz = "0.10"
totp-rs = { version = "5", features = ["gen_secret", "qr"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
