function work(){const labels=[['todos','待辦'],['calendar','月曆'],['projects','項目'],['records','紀錄']];return head('工作','把待辦、日期、項目和已完成的事放在同一脈絡。',`<button class="text-button" data-open-attendance>我的打卡</button>${state.work==='todos'?'<button class="button primary-action" data-new-task>＋ 新增待辦</button>':''}`,'WORK IN CONTEXT')+`<nav class="tabs" role="tablist" aria-label="工作查看方式">${labels.map(([id,label])=>`<button role="tab" class="tab" data-work="${id}" aria-selected="${state.work===id}">${label}</button>`).join('')}</nav>`+(state.work==='todos'?`<div class="tools"><span class="count">一份清單，保留每項工作的來源</span><span class="pill">${tasks.filter(t=>!t.done).length} 項未完成</span></div><section class="panel"><div class="panel-body">${taskRows(tasks.filter(t=>(t.title+t.project).includes(state.query)))}</div></section>`:state.work==='calendar'?calendar():state.work==='projects'?projects():`<section class="panel">${records.filter(r=>(r.title+r.text).includes(state.query)).map(r=>`<article class="record-row"><div class="record-date">${r.date} · 工作紀錄</div><h3>${escape(r.title)}</h3><p>${escape(r.text)}</p></article>`).join('')||'<div class="empty">沒有符合條件的紀錄。</div>'}</section>`)}
function calendarEvents(date){const due=tasks.filter(t=>t.date===date&&(t.title+t.project).includes(state.query)),record=records.filter(r=>r.date===date&&(r.title+r.text).includes(state.query));return due.map(t=>`<div class="cal-item"><b>待辦期限${t.done?' · 已完成':''}</b>${escape(t.title)}</div>`).join('')+record.map(r=>`<div class="cal-item record"><b>工作紀錄</b>${escape(r.title)}</div>`).join('')+(date===today&&state.attendance?`<div class="cal-item att"><b>出勤紀錄 · 示範</b>09:15 到班${state.attendance===2?' · 18:05 離班':''}</div>`:'')}

function materialCard(m){return `<article class="material-card ${state.selected.has(m.id)?'selected':''}"><div class="card-top"><span class="file-mark">${m.mark}</span><label class="select-material"><input type="checkbox" data-select="${m.id}" ${state.selected.has(m.id)?'checked':''}>選用<span class="sr-only">${escape(m.title)}</span></label></div><h3>${escape(m.title)}</h3><p>${escape(m.note)}</p><div class="card-tags">${m.labels.map(l=>`<span class="tag"># ${escape(l)}</span>`).join('')}</div><div class="row" style="margin-top:12px;gap:5px"><span class="pill">${m.status}</span>${m.pending?'<span class="pill gold">待整理</span>':''}</div><div class="card-bottom"><small>${escape(m.topic||'未放入主題')}</small><button class="text-button" data-detail="${m.id}">查看</button></div></article>`}
function data(){let list=materials.filter(m=>(m.title+m.note+m.topic+m.labels.join(' ')).includes(state.query)&&(state.type==='all'||m.type===state.type)&&(state.label==='all'||m.labels.includes(state.label)));if(state.data==='pending')list=list.filter(m=>m.pending);if(state.data==='favorite')list=list.filter(m=>m.favorite);const labels=[...new Set(materials.flatMap(m=>m.labels))];const tabs=[['all','全部'],['pending','待整理'],['topics','主題'],['favorite','常用']];let content=state.data==='topics'?[...new Set(list.map(m=>m.topic||'未放入主題'))].map(topic=>`<section style="margin-bottom:25px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>${escape(topic)}</h2><small>${list.filter(m=>(m.topic||'未放入主題')===topic).length} 份材料</small></div><div class="data-grid">${list.filter(m=>(m.topic||'未放入主題')===topic).map(materialCard).join('')}</div></section>`).join(''):`<div class="data-grid">${list.map(materialCard).join('')}</div>`;return head('資料','先收集，再整理成下一次工作可以選用的材料。','<button class="button primary-action" data-collect>＋ 收集</button>','MATERIALS TO WORK WITH')+`<nav class="tabs" role="tablist" aria-label="資料查看方式">${tabs.map(([id,label])=>`<button role="tab" class="tab" data-data="${id}" aria-selected="${state.data===id}">${label}${id==='pending'?` <small>${materials.filter(m=>m.pending).length}</small>`:''}</button>`).join('')}</nav><div class="tools"><div class="filters"><label><span class="sr-only">按材料類型篩選</span><select id="type-filter"><option value="all">所有類型</option>${Object.entries(typeNames).map(([id,name])=>`<option value="${id}" ${state.type===id?'selected':''}>${name}</option>`).join('')}</select></label><label><span class="sr-only">按標籤篩選</span><select id="label-filter"><option value="all">所有標籤</option>${labels.map(l=>`<option ${state.label===l?'selected':''}>${escape(l)}</option>`).join('')}</select></label></div><span class="count">${list.length} 份原始材料</span></div>${content||'<div class="panel empty">沒有符合條件的材料。</div>'}${state.selected.size?`<div class="selection-bar"><span>已選 ${state.selected.size} 份材料 <small>· 只交接所選引用</small></span><button class="button primary-action" data-prepare>準備交接 →</button></div>`:''}<p class="note">「待整理」是整理進度；「只有網址／已有文字／原檔已存」是材料取得狀態。分類及標籤不代表已由 AI 閱讀或理解。</p>`}
function brief(){const chosen=materials.filter(m=>state.selected.has(m.id));return `【示範交接；尚未執行工作】\n本次目標：${state.goal||'尚未填寫'}\n專業方法：${state.method==='video'?'影片規劃':'一般專業工作'}\n選定材料：\n${chosen.length?chosen.map(m=>`- ${m.title}（${m.status}；示範引用 ${m.id}）`).join('\n'):'尚未選定；請到「資料」選擇本次材料。'}\n\n只使用本次選定且可讀取的材料。引用不包含原檔；實際處理前須讀取內容，核對當前工具與授權。將實際成果及來源放回同一工作台，再讀回確認。`}
function ai(){return head('專業方法與交接','整理本次要求和材料，交給左側 Codex 繼續。','','METHODS & HANDOFF')+`<div class="ai-grid"><section class="panel"><div class="panel-head"><h2>這次想完成甚麼</h2><span class="pill">草稿 · 示範</span></div><div class="panel-body"><label class="field">專業方法<select id="method"><option value="video" ${state.method==='video'?'selected':''}>影片規劃</option><option value="general" ${state.method==='general'?'selected':''}>一般專業工作</option></select><span class="field-hint">方法可以重用；本次材料與要求分開保留。</span></label><label class="field">本次要求<textarea id="goal" rows="4">${escape(state.goal)}</textarea></label><div class="section-caption">本次選定材料 · ${state.selected.size} 份</div>${state.selected.size?materials.filter(m=>state.selected.has(m.id)).map(m=>`<div class="material-mini"><span class="file-mark">${m.mark}</span><div class="copy">${escape(m.title)}<small>${m.status}</small></div><button class="text-button" data-remove="${m.id}">移除<span class="sr-only">${escape(m.title)}</span></button></div>`).join(''):'<p class="muted" style="font-size:12px">尚未選定材料。</p>'}<button class="text-button" data-choose style="margin-top:13px">到資料選材料 →</button><details><summary>進階工具</summary><p>這份概念稿只展示專業方法與工作交接。接駁設定保留在所用客戶端，本頁沒有模型或 Agent 開發功能。</p></details></div></section><section class="panel"><div class="panel-head"><h2>交接預覽</h2><span class="pill gold">尚未執行</span></div><div class="panel-body"><label class="field"><span class="sr-only">示範交接內容</span><textarea class="brief-output" id="brief" rows="13" readonly>${escape(brief())}</textarea></label><button class="button primary-action" id="copy-brief">複製交接內容</button><p class="field-hint" style="margin-top:13px">複製只準備文字，不會啟動 Codex、製作影片或保存成果。示範材料沒有真實附件。</p></div></section></div>`}

document.addEventListener('keydown',event=>{if(event.key==='Escape')$('attendance-drawer').hidden=true});
function collectKind(){const type=$('collect-kind').value;$('collect-content-name').textContent=type==='url'?'示範網址':type==='note'?'筆記內容':'示範檔案說明';$('collect-content').placeholder=type==='url'?'https://example.invalid/reference':type==='note'?'輸入合成的示範筆記。':'只填示範說明，不上載真實檔案。'}
$('collect-form').addEventListener('submit',event=>{event.preventDefault();const type=$('collect-kind').value,title=$('collect-name').value.trim();if(!title)return;materials.push({id:'demo-'+materials.length,title,type,mark:type==='url'?'LINK':type==='note'?'NOTE':'FILE',status:type==='url'?'只有網址':type==='note'?'已有文字':'原檔已存',pending:true,favorite:false,topic:'',labels:['新收集'],note:type==='url'?'只有網址，內容尚未取得。':'本次互動新增的示範材料。',content:type==='file'?'【只有合成示範資料】本稿沒有上載或保存原檔。\n'+$('collect-content').value:$('collect-content').value||'尚未填寫內容。'});$('collect-dialog').close();state.data='pending';state.type='all';state.label='all';go('data');toast('已加入暫時示範清單，重新開啟即還原。')});
$('task-form').addEventListener('submit',event=>{event.preventDefault();const title=$('task-name').value.trim();if(!title)return;tasks.push({id:'demo-task-'+tasks.length,title,project:'日常工作',date:$('task-date').value,done:false});$('task-dialog').close();render();toast('已加入示範待辦，沒有保存到工作台。')});
render();
</script>
</body>
</html>
