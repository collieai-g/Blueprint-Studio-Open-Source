<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藍圖工作室｜沿用原視覺的內容概念稿</title>
<!-- Visual baseline: production CSS and chrome from f90c0d47fcdd93a09d70b1cc7482792b7b1259b3. All data is synthetic. -->
<style data-blueprint-source="library_web/style.css" data-source-sha256="6825b89ccf9ce05bc5288455f6b8c6f97eb80e89476aa81487ef548d87f21bda">
:root {
  color-scheme: light;
  --canvas: #f7f6f3; --surface: #fff; --ink: #2e2b36; --muted: #746b7d;
  --line: #e8e5e9; --line-strong: #d9d3df; --accent: #6f5ce7;
  --accent-dark: #5845cf; --accent-soft: #efecfc; --sidebar-width: 232px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-synthesis: none; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  line-height: 1.6; color: var(--ink); background: var(--canvas);
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: not-allowed; opacity: .5; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: var(--accent-dark); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
input, select, textarea { min-width: 0; max-width: 100%; color: var(--ink); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid #a89bf4; outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 10px 15px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.skip-link:focus { top: 10px; }
.ui-icon { display: block; width: 18px; height: 18px; flex: 0 0 auto; stroke-width: 1.7; }
[data-icon] { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.muted { color: var(--muted); font-size: 13px; }
.small-text { margin-top: 16px; font-size: 11px; line-height: 1.7; }
.eyebrow { margin-bottom: 5px; color: #85808d; font-size: 10px; font-weight: 650; letter-spacing: .14em; }

/* Persistent navigation */
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; display: flex; flex-direction: column; width: var(--sidebar-width); height: 100vh; height: 100dvh; padding: 26px 17px 16px; overflow-y: auto; overscroll-behavior: contain; background: #fdfdfc; border-right: 1px solid var(--line); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 9px; color: var(--ink); text-decoration: none; }
.brand-symbol { display: grid; place-items: center; width: 33px; height: 36px; border-radius: 10px 10px 10px 3px; background: var(--accent); color: #fff; font-size: 24px; font-weight: 750; line-height: 1; }
.sidebar-brand strong { display: block; font-size: 14px; font-weight: 720; letter-spacing: -.35px; }
.sidebar-brand small { display: block; margin-top: 1px; color: #827e8b; font-size: 8px; font-weight: 650; letter-spacing: .19em; }
.workspace-label { display: flex; align-items: center; gap: 9px; margin: 29px 7px 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.workspace-label > div { flex: 1; min-width: 0; }
.workspace-label strong, .workspace-label small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace-avatar { display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border: 1px solid #e6e0f4; border-radius: 9px; background: #f2edf9; color: #796990; font-size: 13px; font-weight: 600; }
.workspace-label strong { display: block; font-size: 12px; font-weight: 650; }
.workspace-label small { display: block; margin-top: 2px; color: #817b89; font-size: 10px; }
.nav-label { margin: 0 11px 8px; color: #8c8496; font-size: 10px; font-weight: 650; letter-spacing: .06em; }
.main-nav, .collection-nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 9px 11px; border: 0; border-radius: 7px; background: transparent; color: #77717f; font-size: 12px; font-weight: 500; line-height: 1.5; text-align: left; transition: background .15s, color .15s; }
.nav-item > span:not([data-icon]):not(.nav-count) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item:hover { background: #f4f3f6; color: #4d465e; }
.nav-item.active { background: var(--accent-soft); color: #6250cb; font-weight: 650; }
.nav-item .ui-icon { width: 17px; height: 17px; }
.nav-count { margin-left: auto; min-width: 19px; padding: 0 3px; color: #918797; font-size: 10px; font-variant-numeric: tabular-nums; text-align: center; }
.nav-item.active .nav-count { color: #8272cc; }
.collection-label { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; margin-bottom: 5px; }
.collection-label .icon-button { width: 24px; height: 24px; border-radius: 5px; }
.collection-label .ui-icon { width: 14px; height: 14px; }
.collection-nav { margin-bottom: 4px; }
.collection-icon { width: 20px; height: 20px; flex: 0 0 20px; object-fit: contain; }
.sidebar-hint { margin: 10px 12px; color: #93879e; font-size: 10px; line-height: 1.8; }
.sidebar-bottom { margin-top: auto; padding-top: 35px; }
.sidebar-bottom .nav-item { min-height: 36px; font-size: 11px; }
#version { margin: 16px 11px 0; color: #918697; font-size: 8px; letter-spacing: .025em; overflow-wrap: anywhere; }
.sidebar-backdrop { position: fixed; inset: 0; z-index: 29; padding: 0; border: 0; background: #25233266; backdrop-filter: blur(2px); }

/* Workspace chrome */
.app-main { margin-left: var(--sidebar-width); min-height: 100vh; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; height: 76px; padding: 0 36px; border-bottom: 1px solid var(--line); background: #fbfaf8; position: sticky; top: 0; z-index: 20; }
.topbar-start { display: flex; flex: 1; align-items: center; gap: 12px; min-width: 0; }
.top-actions { display: flex; align-items: center; gap: 19px; flex-shrink: 0; }
.command-button { display: flex; align-items: center; gap: 9px; padding: 7px 0; border: 0; background: transparent; color: #8c8097; font-size: 11px; }
.command-button .ui-icon { width: 15px; height: 15px; }
kbd, .key-button { padding: 1px 5px; border: 1px solid #e2dce8; border-radius: 4px; background: #fff; color: #8c7d96; font-family: inherit; font-size: 10px; font-weight: 400; white-space: nowrap; }
.command-button kbd { margin-left: 16px; font-size: 9px; }
.add-wrapper { position: relative; }
.button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 38px; padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; color: #6b5b79; font-size: 12px; font-weight: 550; line-height: 1.5; text-align: center; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s; }
.button .ui-icon { width: 15px; height: 15px; }
.button.primary { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 2px 3px #5942bb12; }
.button.primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
.button.secondary:hover { border-color: #c8c1db; background: #f8f7fb; }
.button.quiet { border-color: transparent; background: transparent; color: #80718e; }
.button.quiet:hover { background: #efedf5; color: var(--accent-dark); }
.button.small { min-height: 32px; padding: 5px 10px; font-size: 11px; }
#add-item { gap: 8px; min-width: 94px; }
#add-item [data-icon]:last-child .ui-icon { width: 12px; height: 12px; margin-left: 3px; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #91829f; font-size: 22px; line-height: 1; }
.icon-button:hover { background: #eeecf3; color: #62577c; }
.mobile-menu { display: none; }
.add-menu { position: absolute; top: calc(100% + 9px); right: 0; z-index: 15; min-width: 174px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 9px 30px #26203c15, 0 2px 6px #26203c08; }
.add-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 11px; border: 0; border-radius: 5px; background: transparent; color: #776283; font-size: 12px; text-align: left; }
.add-menu button:hover { background: var(--accent-soft); color: var(--accent-dark); }
.add-menu .ui-icon { width: 16px; height: 16px; }
.add-menu hr { margin: 5px 6px; border: 0; border-top: 1px solid var(--line); }
.add-menu kbd { margin-left: auto; }
#page-layout-tools { display: flex; align-items: center; gap: 6px; }

main { width: 100%; max-width: 1432px; padding: 30px 36px 0; margin: 0 auto; }
.page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
.page-heading h1 { color: #39303f; font-size: 30px; font-weight: 650; line-height: 1.4; letter-spacing: -.035em; overflow-wrap: anywhere; }
.title-dot { margin-left: 2px; color: var(--accent); }
#page-description { margin-top: 7px; color: #8a7a95; font-size: 12px; line-height: 1.7; }
.page-date { padding-bottom: 3px; color: #93819f; font-size: 10px; white-space: nowrap; }
.notice { margin-bottom: 20px; padding: 11px 15px; border: 1px solid #d8e8df; border-radius: 8px; background: #f0f7f2; color: #46745a; font-size: 12px; overflow-wrap: anywhere; }
.notice.error { border-color: #eed6d1; background: #fff4f0; color: #a35c50; }

/* Dashboard */
.welcome-card { display: flex; align-items: center; justify-content: space-between; min-height: 144px; padding: 24px 30px; border: 1px solid #e4def2; border-radius: 12px; background: #eeebf8; overflow: hidden; }
.subtle-label { color: #89739f; font-size: 9px; font-weight: 600; letter-spacing: .12em; }
.welcome-card h2 { margin: 7px 0 8px; color: #5a456e; font-size: 23px; font-weight: 600; letter-spacing: -.025em; }
.welcome-card p { color: #8a6e9f; font-size: 11px; }
.welcome-copy { flex: 1; min-width: 0; }
.welcome-copy > .button { margin-top: 16px; }
.welcome-art { display: flex; align-items: center; justify-content: flex-end; gap: 14px; width: 228px; height: 88px; flex: 0 0 228px; margin-left: 24px; }
.art-orbit { display: none; }
.welcome-art img { width: 64px; height: 64px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; object-fit: contain; }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 17px; }
.stat-card { min-width: 0; padding: 15px 18px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; transition: border-color .15s, box-shadow .15s; }
.stat-card:hover { border-color: #c9bfed; box-shadow: 0 3px 10px #4b3b7810; }
.stat-card > span { display: flex; align-items: center; gap: 8px; color: #81708e; font-size: 11px; }
.stat-card > span .ui-icon { width: 15px; height: 15px; color: #9b87ac; }
.stat-card strong { display: block; margin: 5px 0; color: #57435f; font-size: 25px; font-weight: 550; line-height: 1.4; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.stat-card small { display: flex; align-items: center; justify-content: space-between; gap: 5px; color: #927b9e; font-size: 9px; }
.stat-card small .ui-icon { width: 13px; height: 13px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 25px 0 12px; }
.section-title h2 { color: #685171; font-size: 13px; font-weight: 600; }
.section-title > span { color: #967ca4; font-size: 10px; }
.quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.quick-action { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 78px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; transition: border-color .15s, background .15s; }
.quick-action:hover { border-color: #cdc4e6; background: #fdfcff; }
.quick-icon { display: flex; align-items: center; justify-content: center; width: 37px; height: 37px; flex: 0 0 37px; border-radius: 10px; }
.quick-icon.violet { background: #f0ecfb; color: #947bd1; }
.quick-icon.peach { background: #fcf0e8; color: #b78d70; }
.quick-icon.sage { background: #ebf2eb; color: #7d9681; }
.quick-icon .ui-icon { width: 18px; height: 18px; }
.quick-action > span:nth-child(2) { flex: 1; min-width: 0; }
.quick-action strong { display: block; color: #7a5c85; font-size: 11px; font-weight: 600; }
.quick-action small { display: block; margin-top: 5px; color: #987ba5; font-size: 9px; line-height: 1.6; }
.quick-action > [data-icon]:last-child { color: #b5a0c0; }
.quick-action > [data-icon]:last-child .ui-icon { width: 14px; height: 14px; }

/* Resource library */
.library-heading { align-items: flex-end; margin-top: 27px; margin-bottom: 14px; }
.library-heading h2 { font-size: 14px; }
#result-count { margin-top: 4px; color: #947aa2; font-size: 10px; }
.display-controls { display: flex; align-items: center; gap: 12px; }
.display-controls select { height: 28px; padding: 2px 25px 2px 5px; border-color: transparent; background: transparent; color: #9476a5; font-size: 10px; }
.view-switch { display: flex; align-items: center; gap: 1px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: #efedea; }
.view-switch .icon-button { width: 25px; height: 25px; border-radius: 4px; color: #a991b8; }
.view-switch .icon-button .ui-icon { width: 13px; height: 13px; }
.view-switch .icon-button.active { background: #fff; color: #8c79b7; box-shadow: 0 1px 3px #4940520d; }
.library-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 17px; }
.search-field { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 150px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: #a18ab0; }
.search-field .ui-icon { width: 15px; height: 15px; }
.search-field:focus-within { border-color: #ab9de3; box-shadow: 0 0 0 2px #bfb4f424; }
.search-field input[type=search] { width: 100%; height: 37px; padding: 7px 0; border: 0; background: transparent; font-size: 11px; }
.search-field input:focus { outline: none; }
input::placeholder, textarea::placeholder { color: #a28bb1; opacity: 1; }
input:not([type=checkbox]):not([type=file]), textarea, select { border: 1px solid #e1dce7; border-radius: 7px; background: #fff; }
.search-field input:not([type=checkbox]) { border: 0; }
.library-toolbar select { height: 39px; max-width: 180px; padding: 6px 28px 6px 11px; border-color: var(--line); color: #9277a2; font-size: 11px; }
.library-toolbar > label:not(.search-field) { min-width: 0; }
select { cursor: pointer; }
.selection-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 16px; padding: 9px 12px; border: 1px solid #dbd3f5; border-radius: 8px; background: #f0ecfb; }
.checkbox { display: inline-flex; align-items: center; gap: 8px; color: #7b6f99; font-size: 11px; }
input[type=checkbox] { width: 15px; height: 15px; flex-shrink: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
.item-card { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 215px; padding: 18px 18px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
.item-card:hover { border-color: #d3c9e4; box-shadow: 0 3px 12px #4d3c6f09; }
.item-card.selected { border-color: #a89adf; background: #fcfaff; box-shadow: 0 0 0 1px #b4a7e652; }
.card-controls { position: absolute; top: 12px; right: 10px; display: flex; align-items: center; gap: 1px; }
.card-select-label { display: inline-flex; align-items: center; justify-content: center; width: 27px; height: 28px; border-radius: 5px; cursor: pointer; }
.card-select-label:hover { background: #f2eef9; }
.card-select-checkbox { opacity: .65; }
.item-card:hover .card-select-checkbox, .item-card.selected .card-select-checkbox, .card-select-checkbox:focus-visible { opacity: 1; }
.star-button { display: inline-flex; align-items: center; justify-content: center; width: 27px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #b7a2c6; }
.star-button .ui-icon { width: 15px; height: 15px; }
.star-button:hover { background: #faf4e7; color: #b99a5d; }
.star-button.pinned { color: #ac8b46; }
.star-button.pinned .ui-icon { fill: #f3dfaa; }
.item-top { display: flex; align-items: center; gap: 11px; min-height: 51px; padding-right: 43px; }
.item-icon { width: 42px; height: 42px; flex: 0 0 42px; object-fit: contain; }
.item-title-group { flex: 1; min-width: 0; }
.item-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 100%; padding: 0; border: 0; background: transparent; color: #70537d; font-size: 12px; font-weight: 600; line-height: 1.65; text-align: left; overflow-wrap: anywhere; }
.item-title:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
.item-source { margin-top: 4px; overflow: hidden; color: #9e82ae; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.item-notes { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 35px; overflow: hidden; color: #9779a7; font-size: 10px; line-height: 1.8; overflow-wrap: anywhere; white-space: pre-wrap; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; }
.badge { display: inline-block; max-width: 100%; padding: 2px 7px; border-radius: 4px; background: #f3eff8; color: #9473ac; font-size: 9px; line-height: 1.6; overflow-wrap: anywhere; }
.badge.source { background: #edf3ee; color: #76927b; }
.badge.type { background: #f5f1e9; color: #9a8969; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f0edf3; color: #a086b0; font-size: 9px; }
.card-bottom > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-bottom .ui-icon { width: 12px; height: 12px; }
.item-grid.list-mode { grid-template-columns: 1fr; gap: 8px; }
.list-mode .item-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, .8fr); align-items: center; gap: 18px; min-height: 98px; padding: 14px 82px 14px 17px; }
.list-mode .card-controls { top: 50%; right: 16px; transform: translateY(-50%); }
.list-mode .item-top { padding-right: 0; min-height: 45px; }
.list-mode .item-icon { width: 36px; height: 36px; flex-basis: 36px; }
.list-mode .item-notes { min-height: 0; }
.list-mode .card-bottom { grid-column: 1 / -1; margin-top: -8px; padding: 0 0 0 47px; border: 0; }
.empty-state { padding: 45px 20px; border: 1px dashed #dcd4e6; border-radius: 11px; background: #faf9fb; text-align: center; }
.empty-art { display: grid; place-items: center; width: 85px; height: 85px; margin: 0 auto 17px; border: 1px solid #ece5f3; border-radius: 24px; background: #f2edf8; }
.empty-art img { width: 60px; height: 60px; opacity: .85; }
.empty-state h3 { color: #8a6d9d; font-size: 15px; font-weight: 550; }
.empty-state p { max-width: 360px; margin: 8px auto 20px; color: #a082b1; font-size: 11px; line-height: 1.8; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0 5px; }
#page-label { font-size: 10px; }
.main-footer { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 25px 0 22px; color: #a68bb5; font-size: 9px; }
.main-footer button { display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #a082b0; font-size: 9px; }
.main-footer .ui-icon { width: 12px; height: 12px; }

/* Forms, resource details, and the command palette */
dialog { width: min(620px, calc(100% - 40px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); padding: 27px 29px; overflow: auto; overscroll-behavior: contain; border: 1px solid #e6dfed; border-radius: 14px; background: #fff; color: var(--ink); box-shadow: 0 25px 100px #28203533; }
dialog::backdrop { background: #302b3f61; backdrop-filter: blur(3px); }
.dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 9px; }
.dialog-heading h2 { color: #6c507b; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.dialog-heading .icon-button { width: 30px; height: 30px; border: 1px solid #eeeaf2; background: #faf9fc; font-size: 20px; }
dialog .muted { font-size: 12px; line-height: 1.8; }
.field { display: flex; flex-direction: column; gap: 7px; margin-top: 19px; color: #8a6b9c; font-size: 12px; font-weight: 550; }
.field input:not([type=file]), .field select, .field textarea { width: 100%; min-height: 40px; padding: 9px 11px; font-size: 12px; font-weight: 400; line-height: 1.7; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #b0a0dc; }

function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3800)}
function openDialog(id){$(id).showModal()}
function head(title,sub,action='',kicker=''){return `<div class="${state.page==='overview'?'prototype-overview-heading':'studio-page-header'}"><div class="${state.page==='overview'?'workspace-text':''}"><div class="${state.page==='overview'?'text-content':''}"><h1>${title}</h1></div><p class="muted">${sub}</p></div><div class="actions">${action}</div></div>`}
function taskRows(list){return list.length?list.map(t=>`<div class="task-row ${t.done?'done':''}"><input id="check-${t.id}" type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><label for="check-${t.id}"><span class="task-title">${escape(t.title)}</span><span class="task-detail">${escape(t.project)}</span></label><span class="date-label">${t.date===today?'今日':escape(t.date.slice(5).replace('-','/'))}</span></div>`).join(''):'<div class="empty">沒有符合條件的待辦。</div>'}
function attendanceButton(){return `<button class="button primary-action" data-attendance ${state.attendance===2?'disabled':''}>${['到班','離班','今日已記錄'][state.attendance]}</button>`}
function overview(){return head('總覽','2026 年 10 月 26 日，星期一','<span class="pill">已選加入「今日工作」卡</span>','YOUR WORKDAY')+`<div class="overview-grid"><section class="panel"><header class="panel-head"><div><h2>今日工作</h2><p class="today-meta">先看今天，再繼續手上的事。</p></div><span class="pill green">示範卡片</span></header><div class="panel-body"><div class="attendance"><div><div class="section-caption">我的出勤 · 香港時間</div><div class="attendance-time">${state.attendance===0?'尚未到班':state.attendance===1?'09:15 —':'09:15 — 18:05'}</div><small>${['按到班，試看今日狀態。','已到班 · 尚未離班','今日出勤已結束'][state.attendance]}</small></div><div>${attendanceButton()}<small>示範時間，並非真實打卡</small></div></div><div class="section-caption">今日待辦</div>${taskRows(tasks.filter(t=>t.date===today&&t.title.includes(state.query)))}<div class="today-footer"><button class="text-button" data-go-work="todos">查看全部待辦 →</button><button class="text-button" data-open-attendance>我的紀錄</button></div></div></section><div class="today-materials"><section class="panel"><header class="panel-head"><h2>繼續手上的工作</h2><span class="pill">秋季短片</span></header><div class="panel-body"><p class="muted" style="font-size:12px;margin-bottom:7px">材料已集中，下一步確認分鏡。</p>${materials.filter(m=>m.topic==='秋季短片').map(m=>`<div class="material-mini"><span class="file-mark">${icon(m.type==='url'?'link':m.mark==='MP4'?'play':'document')}</span><div class="copy"><span>${escape(m.title)}</span><small>${m.status}</small></div><button class="text-button" data-detail="${m.id}">查看</button></div>`).join('')}<button class="text-button" style="margin-top:18px" data-open-topic="秋季短片">打開這個主題 →</button></div></section><p class="note">此處示範使用者已選加入的卡片。正式產品原有的空白總覽預設不因本稿改變。</p></div></div>`}
function work(){const labels=[['todos','待辦'],['calendar','月曆'],['projects','項目'],['records','紀錄']];return head('工作','把待辦、日期、項目和已完成的事放在同一脈絡。',`<button class="text-button" data-open-attendance>我的打卡</button>${state.work==='todos'?'<button class="button primary-action" data-new-task>＋ 新增待辦</button>':''}`,'WORK IN CONTEXT')+`<nav class="tabs" role="tablist" aria-label="工作查看方式">${labels.map(([id,label])=>`<button role="tab" class="tab" data-work="${id}" aria-selected="${state.work===id}">${label}</button>`).join('')}</nav>`+(state.work==='todos'?`<div class="tools"><span class="count">一份清單，保留每項工作的來源</span><span class="pill">${tasks.filter(t=>!t.done).length} 項未完成</span></div><section class="panel"><div class="panel-body">${taskRows(tasks.filter(t=>(t.title+t.project).includes(state.query)))}</div></section>`:state.work==='calendar'?calendar():state.work==='projects'?projects():`<section class="panel">${records.filter(r=>(r.title+r.text).includes(state.query)).map(r=>`<article class="record-row"><div class="record-date">${r.date} · 工作紀錄</div><h3>${escape(r.title)}</h3><p>${escape(r.text)}</p></article>`).join('')||'<div class="empty">沒有符合條件的紀錄。</div>'}</section>`)}
function calendarEvents(date){const due=tasks.filter(t=>t.date===date&&(t.title+t.project).includes(state.query)),record=records.filter(r=>r.date===date&&(r.title+r.text).includes(state.query));return due.map(t=>`<div class="cal-item"><b>待辦期限${t.done?' · 已完成':''}</b>${escape(t.title)}</div>`).join('')+record.map(r=>`<div class="cal-item record"><b>工作紀錄</b>${escape(r.title)}</div>`).join('')+(date===today&&state.attendance?`<div class="cal-item att"><b>出勤紀錄 · 示範</b>09:15 到班${state.attendance===2?' · 18:05 離班':''}</div>`:'')}
function calendar(){const first=new Date(Date.UTC(2026,9+state.month,1)),offset=(first.getUTCDay()+6)%7,last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)),count=Math.ceil((offset+last.getUTCDate())/7)*7,days=Array.from({length:count},(_,i)=>new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),i-offset+1))),iso=d=>d.toISOString().slice(0,10);return `<section class="panel"><div class="calendar-head"><div><h2>${first.getUTCFullYear()} 年 ${first.getUTCMonth()+1} 月</h2><small>月份與選定日期 · 香港時間</small></div><div class="row"><button class="button" data-month="-1" aria-label="上一個月">‹</button><button class="button" data-this-month>本月</button><button class="button" data-month="1" aria-label="下一個月">›</button></div></div><div class="calendar-legend"><span><i class="legend-dot"></i>期限</span><span><i class="legend-dot record"></i>工作紀錄</span><span><i class="legend-dot att"></i>出勤紀錄</span></div><div class="calendar month-grid">${days.map((d,i)=>{const date=iso(d),events=calendarEvents(date),other=d.getUTCMonth()!==first.getUTCMonth();return `<div class="day ${date===today?'today':''} ${date===state.selectedDate?'selected':''} ${other?'other':''} ${events?'has-events':''}"><div><div class="day-name">星期${'一二三四五六日'[i%7]}</div><div class="day-number"><button class="day-selector" data-calendar-date="${date}" aria-label="查看 ${date} 的內容" aria-pressed="${date===state.selectedDate}">${d.getUTCDate()}</button></div></div><div class="day-events">${events||'<span class="mobile-empty">這天沒有期限或紀錄。</span>'}</div></div>`}).join('')}</div><div class="date-detail"><div class="section-caption">選定日期 · ${state.selectedDate}</div>${calendarEvents(state.selectedDate)||'<p class="muted" style="font-size:12px">這天沒有期限或紀錄。</p>'}</div><p class="calendar-note">期限表示要完成的日期；紀錄表示已發生的事。本稿沒有會議或預約，也沒有接駁或同步外部月曆。</p></section>`}
function projects(){return `<div class="project-grid">${[{name:'秋季短片',desc:'從產品素材到 30 秒直式短片，先核對要求與分鏡。',progress:35,date:'10 月 30 日'},{name:'日常工作',desc:'集中本月宣傳方向、工作紀錄與後續待辦。',progress:60,date:'11 月 2 日'}].filter(p=>(p.name+p.desc).includes(state.query)).map(p=>`<article class="panel project"><div class="row" style="justify-content:space-between"><h2>${p.name}</h2><span class="pill">進行中</span></div><p>${p.desc}</p><div class="progress" aria-label="示範進度 ${p.progress}%"><span style="width:${p.progress}%"></span></div><div class="row" style="justify-content:space-between"><small>預計完成 ${p.date}</small><button class="text-button" data-open-topic="${p.name}">查看相關材料 →</button></div></article>`).join('')}</div>`}
function materialCard(m){return `<article class="material-card ${state.selected.has(m.id)?'selected':''}"><div class="card-top"><span class="file-mark">${icon(m.type==='url'?'link':m.mark==='MP4'?'play':'document')}</span><label class="select-material"><input type="checkbox" data-select="${m.id}" ${state.selected.has(m.id)?'checked':''}>選用<span class="sr-only">${escape(m.title)}</span></label></div><h3>${escape(m.title)}</h3><p>${escape(m.note)}</p><div class="card-tags">${m.labels.map(l=>`<span class="tag"># ${escape(l)}</span>`).join('')}</div><div class="row" style="margin-top:12px;gap:5px"><span class="pill">${m.status}</span>${m.pending?'<span class="pill gold">待整理</span>':''}</div><div class="card-bottom"><small>${escape(m.topic||'未放入主題')}</small><button class="text-button" data-detail="${m.id}">查看</button></div></article>`}
function data(){let list=materials.filter(m=>(m.title+m.note+m.topic+m.labels.join(' ')).includes(state.query)&&(state.type==='all'||m.type===state.type)&&(state.label==='all'||m.labels.includes(state.label)));if(state.data==='pending')list=list.filter(m=>m.pending);if(state.data==='favorite')list=list.filter(m=>m.favorite);const labels=[...new Set(materials.flatMap(m=>m.labels))];const tabs=[['all','全部'],['pending','待整理'],['topics','主題'],['favorite','常用']];let content=state.data==='topics'?[...new Set(list.map(m=>m.topic||'未放入主題'))].map(topic=>`<section style="margin-bottom:25px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>${escape(topic)}</h2><small>${list.filter(m=>(m.topic||'未放入主題')===topic).length} 份材料</small></div><div class="data-grid">${list.filter(m=>(m.topic||'未放入主題')===topic).map(materialCard).join('')}</div></section>`).join(''):`<div class="data-grid">${list.map(materialCard).join('')}</div>`;return head('資料','先收集，再整理成下一次工作可以選用的材料。','<button class="button primary-action" data-collect>＋ 收集</button>','MATERIALS TO WORK WITH')+`<nav class="tabs" role="tablist" aria-label="資料查看方式">${tabs.map(([id,label])=>`<button role="tab" class="tab" data-data="${id}" aria-selected="${state.data===id}">${label}${id==='pending'?` <small>${materials.filter(m=>m.pending).length}</small>`:''}</button>`).join('')}</nav><div class="tools"><div class="filters"><label><span class="sr-only">按材料類型篩選</span><select id="type-filter"><option value="all">所有類型</option>${Object.entries(typeNames).map(([id,name])=>`<option value="${id}" ${state.type===id?'selected':''}>${name}</option>`).join('')}</select></label><label><span class="sr-only">按標籤篩選</span><select id="label-filter"><option value="all">所有標籤</option>${labels.map(l=>`<option ${state.label===l?'selected':''}>${escape(l)}</option>`).join('')}</select></label></div><span class="count">${list.length} 份原始材料</span></div>${content||'<div class="panel empty">沒有符合條件的材料。</div>'}${state.selected.size?`<div class="selection-bar"><span>已選 ${state.selected.size} 份材料 <small>· 只交接所選引用</small></span><button class="button primary-action" data-prepare>準備交接 →</button></div>`:''}<p class="note">「待整理」是整理進度；「只有網址／已有文字／原檔已存」是材料取得狀態。分類及標籤不代表已由 AI 閱讀或理解。</p>`}
function brief(){const chosen=materials.filter(m=>state.selected.has(m.id));return `【示範交接；尚未執行工作】\n本次目標：${state.goal||'尚未填寫'}\n專業方法：${state.method==='video'?'影片規劃':'一般專業工作'}\n選定材料：\n${chosen.length?chosen.map(m=>`- ${m.title}（${m.status}；示範引用 ${m.id}）`).join('\n'):'尚未選定；請到「資料」選擇本次材料。'}\n\n只使用本次選定且可讀取的材料。引用不包含原檔；實際處理前須讀取內容，核對當前工具與授權。將實際成果及來源放回同一工作台，再讀回確認。`}
function ai(){return head('專業方法與交接','整理本次要求和材料，交給左側 Codex 繼續。','','METHODS & HANDOFF')+`<div class="ai-grid"><section class="panel"><div class="panel-head"><h2>這次想完成甚麼</h2><span class="pill">草稿 · 示範</span></div><div class="panel-body"><label class="field">專業方法<select id="method"><option value="video" ${state.method==='video'?'selected':''}>影片規劃</option><option value="general" ${state.method==='general'?'selected':''}>一般專業工作</option></select><span class="field-hint">方法可以重用；本次材料與要求分開保留。</span></label><label class="field">本次要求<textarea id="goal" rows="4">${escape(state.goal)}</textarea></label><div class="section-caption">本次選定材料 · ${state.selected.size} 份</div>${state.selected.size?materials.filter(m=>state.selected.has(m.id)).map(m=>`<div class="material-mini"><span class="file-mark">${icon(m.type==='url'?'link':m.mark==='MP4'?'play':'document')}</span><div class="copy">${escape(m.title)}<small>${m.status}</small></div><button class="text-button" data-remove="${m.id}">移除<span class="sr-only">${escape(m.title)}</span></button></div>`).join(''):'<p class="muted" style="font-size:12px">尚未選定材料。</p>'}<button class="text-button" data-choose style="margin-top:13px">到資料選材料 →</button><details><summary>進階工具</summary><p>這份概念稿只展示專業方法與工作交接。接駁設定保留在所用客戶端，本頁沒有模型或 Agent 開發功能。</p></details></div></section><section class="panel"><div class="panel-head"><h2>交接預覽</h2><span class="pill gold">尚未執行</span></div><div class="panel-body"><label class="field"><span class="sr-only">示範交接內容</span><textarea class="brief-output" id="brief" rows="13" readonly>${escape(brief())}</textarea></label><button class="button primary-action" id="copy-brief">複製交接內容</button><p class="field-hint" style="margin-top:13px">複製只準備文字，不會啟動 Codex、製作影片或保存成果。示範材料沒有真實附件。</p></div></section></div>`}
function render(){
 document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===state.page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('view').innerHTML=({overview,work,ai,data}[state.page])();$('search').value=state.query;
 const section=$('studio-section-navigation'),tabs=$('view').querySelector('nav.tabs');section.replaceChildren();
 if(tabs){section.setAttribute('role','tablist');[...tabs.children].forEach(b=>{b.className='studio-section-link';b.classList.toggle('active',b.getAttribute('aria-selected')==='true');section.append(b)});tabs.remove()}
 else {section.removeAttribute('role');section.innerHTML=`<span class="studio-section-link active">${state.page==='overview'?'總覽':'專業方法與交接'}</span>`}
 $('view').querySelectorAll('.button').forEach(b=>b.classList.add(b.classList.contains('primary-action')?'primary':'secondary'));
 $('view').querySelectorAll('.pill').forEach(b=>b.classList.add('badge'));
 $('view').querySelectorAll('.panel').forEach(b=>b.classList.add(b.closest('.overview-grid')?'widget-surface':'studio-detail'));
 $('view').querySelectorAll('.material-card').forEach(b=>b.classList.add('item-card'));
 $('view').querySelectorAll('.project').forEach(b=>b.classList.add('studio-card'));
 $('view').querySelectorAll('.task-title').forEach(b=>b.classList.add('work-todo-title'));
 $('view').querySelectorAll('.note').forEach(b=>b.classList.add('studio-scope-note'));
 $('sidebar').classList.remove('open');$('sidebar-backdrop').hidden=true;$('mobile-menu').setAttribute('aria-expanded','false');
 $('add-menu').hidden=true;$('add-item').setAttribute('aria-expanded','false');
}
function go(page){state.page=page;state.query='';render()}
function showAttendance(){const current=state.attendance?`<div class="drawer-row"><strong>10 月 26 日 · 星期一</strong><span>09:15 到班${state.attendance===2?' · 18:05 離班':' · 尚未離班'}</span></div>`:'<div class="drawer-row"><strong>10 月 26 日 · 星期一</strong><span>今日尚未到班</span></div>';$('attendance-body').innerHTML=`<span class="pill gold">全部是示範紀錄</span>${current}<div class="drawer-row"><strong>10 月 23 日 · 星期五</strong><span>09:00 到班 · 18:00 離班</span></div><p class="note">本稿的按鈕只切換暫時示範狀態，不使用真實時鐘，也不建立正式出勤紀錄。</p>`;$('attendance-drawer').hidden=false;$('close-drawer').focus()}
function detail(id){const m=materials.find(v=>v.id===id);$('detail-title').textContent=m.title;$('detail-body').innerHTML=`<div class="row" style="margin-bottom:18px"><span class="pill">${m.status}</span>${m.pending?'<span class="pill gold">待整理</span>':''}</div><p class="brief-output" style="margin-bottom:18px">${escape(m.content)}</p><label class="field">所屬主題<select id="detail-topic"><option value="">未放入主題</option>${['秋季短片','日常工作'].map(t=>`<option ${m.topic===t?'selected':''}>${t}</option>`).join('')}</select></label><div class="row" style="justify-content:space-between"><button class="button" data-favorite="${m.id}">${m.favorite?'移出常用':'加入常用'}</button><button class="button primary-action" data-organize="${m.id}">${m.pending?'完成整理':'更新示範主題'}</button></div><p class="field-hint" style="margin-top:16px">只更新此概念稿的暫時狀態，原始材料仍只有一份。</p>`;openDialog('detail-dialog')}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
 if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.close){$(b.dataset.close).close();return}
 if(b.hasAttribute('data-attendance')){state.attendance=Math.min(2,state.attendance+1);render();toast(state.attendance===1?'示範：09:15 到班。沒有保存正式紀錄。':'示範：18:05 離班。沒有保存正式紀錄。');return}
 if(b.hasAttribute('data-open-attendance')){showAttendance();return}if(b.id==='close-drawer'){$('attendance-drawer').hidden=true;return}
 if(b.dataset.work){state.work=b.dataset.work;state.query='';render();return}if(b.dataset.data){state.data=b.dataset.data;state.query='';render();return}
 if(b.dataset.goWork){state.work=b.dataset.goWork;go('work');return}if(b.hasAttribute('data-month')){state.month+=Number(b.dataset.month);state.selectedDate=new Date(Date.UTC(2026,9+state.month,1)).toISOString().slice(0,10);render();return}if(b.hasAttribute('data-this-month')){state.month=0;state.selectedDate=today;render();return}if(b.dataset.calendarDate){state.selectedDate=b.dataset.calendarDate;render();return}
 if(b.hasAttribute('data-collect')){$('collect-form').reset();collectKind();openDialog('collect-dialog');return}if(b.hasAttribute('data-new-task')){$('task-form').reset();openDialog('task-dialog');return}
 if(b.dataset.detail){detail(b.dataset.detail);return}if(b.dataset.favorite){const m=materials.find(m=>m.id===b.dataset.favorite);m.favorite=!m.favorite;b.textContent=m.favorite?'移出常用':'加入常用';render();return}
 if(b.dataset.organize){const m=materials.find(m=>m.id===b.dataset.organize);m.topic=$('detail-topic').value;m.pending=false;$('detail-dialog').close();render();toast('示範清單已更新；沒有保存到工作台。');return}
 if(b.dataset.openTopic){state.data='topics';state.type='all';state.label='all';state.page='data';state.query=b.dataset.openTopic;render();return}
 if(b.hasAttribute('data-prepare')){go('ai');return}if(b.hasAttribute('data-choose')){state.data='all';go('data');return}if(b.dataset.remove){state.selected.delete(b.dataset.remove);render();return}
 if(b.id==='copy-brief'){const text=$('brief').value;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('已複製示範交接文字；尚未執行工作。')).catch(selectBrief);else selectBrief()}
});
function selectBrief(){$('brief').focus();$('brief').select();toast('已選取交接文字，請使用系統複製；尚未執行工作。')}
document.addEventListener('change',event=>{const e=event.target;if(e.dataset.task){tasks.find(t=>t.id===e.dataset.task).done=e.checked;render()}if(e.dataset.select){if(e.checked)state.selected.add(e.dataset.select);else state.selected.delete(e.dataset.select);render()}if(e.id==='type-filter'){state.type=e.value;render()}if(e.id==='label-filter'){state.label=e.value;render()}if(e.id==='method'){state.method=e.value;$('brief').value=brief()}if(e.id==='collect-kind')collectKind()});
document.addEventListener('input',event=>{if(event.target.id==='search'){const pos=event.target.selectionStart;state.query=event.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)}if(event.target.id==='goal'){state.goal=event.target.value;$('brief').value=brief()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')$('attendance-drawer').hidden=true});
function collectKind(){const type=$('collect-kind').value;$('collect-content-name').textContent=type==='url'?'示範網址':type==='note'?'筆記內容':'示範檔案說明';$('collect-content').placeholder=type==='url'?'https://example.invalid/reference':type==='note'?'輸入合成的示範筆記。':'只填示範說明，不上載真實檔案。'}
$('collect-form').addEventListener('submit',event=>{event.preventDefault();const type=$('collect-kind').value,title=$('collect-name').value.trim();if(!title)return;materials.push({id:'demo-'+materials.length,title,type,mark:type==='url'?'LINK':type==='note'?'NOTE':'FILE',status:type==='url'?'只有網址':type==='note'?'已有文字':'原檔已存',pending:true,favorite:false,topic:'',labels:['新收集'],note:type==='url'?'只有網址，內容尚未取得。':'本次互動新增的示範材料。',content:type==='file'?'【只有合成示範資料】本稿沒有上載或保存原檔。\n'+$('collect-content').value:$('collect-content').value||'尚未填寫內容。'});$('collect-dialog').close();state.data='pending';state.type='all';state.label='all';go('data');toast('已加入暫時示範清單，重新開啟即還原。')});
$('task-form').addEventListener('submit',event=>{event.preventDefault();const title=$('task-name').value.trim();if(!title)return;tasks.push({id:'demo-task-'+tasks.length,title,project:'日常工作',date:$('task-date').value,done:false});$('task-dialog').close();render();toast('已加入示範待辦，沒有保存到工作台。')});

function toggleMenu(){const open=$('add-menu').hidden;$('add-menu').hidden=!open;$('add-item').setAttribute('aria-expanded',String(open))}
$('add-item').addEventListener('click',toggleMenu);
$('command-button').addEventListener('click',()=>{$('add-menu').hidden=true;$('search-dialog').showModal();$('search').focus()});
$('refresh-demo').addEventListener('click',()=>{$('add-menu').hidden=true;toast('這是離線概念稿，沒有連接公司資料。')});
$('preview-layout').addEventListener('click',()=>toast('本稿沿用原版面外觀；未啟用排版編輯或保存。'));
$('settings-button').addEventListener('click',()=>toast('設定不屬本次內容示範，正式工作台保留原設定入口。'));
$('mobile-menu').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('sidebar-backdrop').hidden=!open;$('mobile-menu').setAttribute('aria-expanded',String(open))});
$('sidebar-backdrop').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('sidebar-backdrop').hidden=true;$('mobile-menu').setAttribute('aria-expanded','false')});
document.addEventListener('click',e=>{if(e.target.closest('[data-page],[data-work],[data-data]'))$('search-dialog').close()});
document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));
document.querySelectorAll('dialog .button').forEach(b=>b.classList.add(b.classList.contains('primary-action')?'primary':'secondary'));
render();

</script>
</body></html>
