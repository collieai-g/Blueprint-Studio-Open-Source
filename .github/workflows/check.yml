name: Check Blueprint Studio Backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_packager.cjs
      - run: node --check library_web/app.js
      - run: python tools/build_web.py
      - run: git diff --exit-code -- web/icons.js dist/index.html
