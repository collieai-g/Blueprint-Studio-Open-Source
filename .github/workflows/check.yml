name: Check Blueprint Studio Backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_packager.cjs tests/test_workspace.cjs tests/test_sites_mcp.mjs tests/test_connection.cjs
      - name: Check HTTP MCP with modern and legacy clients
        run: |
          python -m venv /tmp/blueprint-mcp-interop
          /tmp/blueprint-mcp-interop/bin/python -m pip install 'mcp==2.3.0'
          /tmp/blueprint-mcp-interop/bin/python tests/check_mcp_interop.py
      - run: node --check library_web/app.js
      - run: node --check library_web/workdays.js
      - run: node --check library_web/workspace.js
      - run: node --check library_web/connection.js
      - run: python tools/build_web.py
      - run: git diff --exit-code -- web/icons.js dist/index.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete AI installer and same-site update package
        run: |
          python tools/package_installer.py --output "$RUNNER_TEMP/blueprint-studio-$GITHUB_REF_NAME-installer.zip"
          python tools/package_workbench.py --output "$RUNNER_TEMP/blueprint-studio-$GITHUB_REF_NAME-workbench.zip"
      - name: Publish versioned downloads after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/blueprint-studio-$GITHUB_REF_NAME-installer.zip" "$RUNNER_TEMP/blueprint-studio-$GITHUB_REF_NAME-workbench.zip" --verify-tag --title "Blueprint Studio Open Source $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
