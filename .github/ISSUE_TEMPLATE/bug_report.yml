name: 錯誤回報
description: 用合成資料描述可重現問題，保留實際檢查狀態。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        這是公開 Issue。請只提供可公開的來源資訊及合成例子；私人來源可填「私人來源，不公開」，無法核實可填 `unknown`。
        不需要公開真實工作台網址／ID、私人路徑、原始日誌、截圖、本文、附件或備份。不要貼憑證、公司資料或完整聊天。
        先讀 [貢獻指南](https://github.com/collieai-g/Blueprint-Studio-Open-Source/blob/main/CONTRIBUTING.md)、[開發流程](https://github.com/collieai-g/Blueprint-Studio-Open-Source/blob/main/docs/DEVELOPMENT.md)、[驗收規則](https://github.com/collieai-g/Blueprint-Studio-Open-Source/blob/main/docs/DEVELOPMENT_ACCEPTANCE.md)及[私隱規則](https://github.com/collieai-g/Blueprint-Studio-Open-Source/blob/main/docs/PRIVACY.md)。
  - type: input
    id: blueprint_source
    attributes:
      label: Blueprint 版本與完整 commit
      description: 填公開正式 tag 及 40 位 commit，或「私人來源，不公開」；未能核實請填 unknown。來源版本不代表私人網站已部署該版。
      placeholder: "vX.Y.Z / 完整 40 位 commit / 私人來源，不公開 / unknown"
    validations:
      required: true
  - type: textarea
    id: agent_adapter_source
    attributes:
      label: Agent 與 adapter 來源
      description: 分別填公開來源、版本及完整 commit，或「不涉及」「私人來源，不公開」「unknown」。不要填私人倉庫網址或本機路徑。
      placeholder: |
        Agent：
        adapter：
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 問題所屬層
      options:
        - "unknown（尚未定位）"
        - "Blueprint 共用程式／HTTP API"
        - "工作台 UI／排版同步"
        - "原生主機／持久儲存"
        - "Sites gateway／Sites adapter"
        - "獨立 Agent"
        - "AI 客戶端／MCP 接駁"
        - "文件／開發流程"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 執行環境
      description: 只填作業系統、Python／Node、瀏覽器、AI 客戶端及部署類型的名稱與版本；未知項寫 unknown。不填帳戶、網址、工作台 ID 或私人路徑。
      placeholder: "OS：／Runtime：／瀏覽器：／AI 客戶端：／部署類型："
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 合成資料重現步驟
      description: 提供最少步驟及虛構輸入。若尚未重現，說明卡在哪一步；不要附正式資料或備份。
      placeholder: |
        1. 使用合成資料……
        2. 執行……
        3. 觀察……
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 預期與實際結果
      placeholder: |
        預期：
        實際：
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響與範圍
      description: 描述受影響功能、可否繼續使用，以及是否涉及資料、權限或外部動作；不要貼受影響資料正文。
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 實際檢查與狀態
      description: 列出真正執行的命令、環境及通過／失敗／未測。未測寫原因，不適用寫理由；只保留合成摘要，不貼原始日誌。分開記錄來源檢查、實際部署及目前 AI 寫入／讀回。
      placeholder: "命令或檢查：／環境：／狀態：／合成結果或未測原因："
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開前私隱核對
      options:
        - label: 我已逐項檢查以上內容，只保留可公開的程式資訊與合成重現資料。
          required: true
        - label: 我未附上私人來源、正式資料、真實工作台位置、原始證據、備份或憑證；私人證據留在自己的私人位置。
          required: true
