# Copy into the separately authorized distribution repository's .github/workflows/.
# Put only the reviewed signed feed files under pages/. Upload Release assets first.
name: Publish update catalogs
on:
  push:
    branches: [main]
    paths: ['pages/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: update-catalog-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy signed catalog files
        id: deploy
        uses: actions/deploy-pages@v4
