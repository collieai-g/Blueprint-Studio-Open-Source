services:
  app:
    environment: &enterprise-services
      BLUEPRINT_S3_ENDPOINT: http://seaweed:8333
      BLUEPRINT_S3_ACCESS_KEY: ${BLUEPRINT_S3_ACCESS_KEY:?Generate S3 credentials}
      BLUEPRINT_S3_SECRET_KEY: ${BLUEPRINT_S3_SECRET_KEY:?Generate S3 credentials}
      BLUEPRINT_DOCUMENSO_URL: http://documenso:3000
      BLUEPRINT_KEYCLOAK_URL: http://keycloak:8080
      BLUEPRINT_KEYCLOAK_PUBLIC_URL: ${BLUEPRINT_KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      BLUEPRINT_OIDC_ISSUER: ${BLUEPRINT_OIDC_ISSUER:-${BLUEPRINT_KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}/realms/${BLUEPRINT_OIDC_REALM:-blueprint}}
      BLUEPRINT_OIDC_CLIENT_ID: ${BLUEPRINT_OIDC_CLIENT_ID:-blueprint}
      BLUEPRINT_OIDC_CLIENT_SECRET: ${BLUEPRINT_OIDC_CLIENT_SECRET:-}
      BLUEPRINT_COLLABORA_URL: http://collabora:9980
      BLUEPRINT_COLLABORA_PUBLIC_URL: ${BLUEPRINT_COLLABORA_PUBLIC_URL:-http://127.0.0.1:9980}
  worker:
    environment: *enterprise-services
